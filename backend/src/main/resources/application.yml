spring:
  profiles:
    include: secret
  application:
    name: cityfarm

  datasource:
    url: jdbc:mysql://db:3306/cityfarm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID} # 발급받은 Client ID
            client-secret: ${GOOGLE_CLIENT_SECRET} # 발급받은 Client Secret
            scope:
              - profile
              - email