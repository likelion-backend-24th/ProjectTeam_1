spring:
  profiles:
    include: secret
  application:
    name: cityfarm

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mysql://db:3306/cityfarm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

portone:
  store-id: ${PORTONE_STORE_ID}               # 우리팀 상점 아이디
  api-secret: ${PORTONE_API_SECRET}           # API Secret
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}   # 웹훅 시크릿
  webhook-notice-url: ${PORTONE_WEBHOOK_NOTICE_URL:http://54.86.192.52:8080/api/payments/webhooks/portone} # 콘솔에 웹훅 URL을 등록할 수 없어(스토어 공용) 결제/예약 요청 시 noticeUrls로 직접 전달하는 우리 서버 웹훅 주소. 포트(8080) 필수 - Dockerfile EXPOSE 8080 기준, 리버스프록시 없음
  api:
    base-url: https://api.portone.io
  channel-key:
    normal: ${PORTONE_CHANNEL_KEY_NORMAL}     # 일반결제 채널키(토스)
    billing: ${PORTONE_CHANNEL_KEY_BILLING}   # 정기결제 채널키(토스)
    identity: ${PORTONE_CHANNEL_KEY_IDENTITY} # 본인인증 채널키