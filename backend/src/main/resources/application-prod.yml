spring:
  datasource:
    url: jdbc:h2:mem:cityfarm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true # 외부(EC2) 접근 허용

  jpa:
    hibernate:
      ddl-auto: update # create or update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

