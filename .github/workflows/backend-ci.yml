name: backend-CI.yml

on:
  push:
    branches: [ "feat/Docker" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "feat/Docker" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # MySQL 컨테이너 서비스
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: cityfarm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1) 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 21 설치 + Gradle 캐시
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/build.gradle

      # 3) gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4) 빌드 + 테스트 (DB_PASSWORD 환경 변수 전달)
      - name: Build & Test
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew clean build

      # 5) 테스트 리포트 보관
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test