name: backend-ci.yml

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "dev", "main" ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      # 1) 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 17 설치 + Gradle 캐시
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: backend/build.gradle # 캐시 기준 파일 경로 명시

      # 3) gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4) 빌드 + 테스트
      - name: Build & Test
        run: ./gradlew clean build

      # 5) 테스트 리포트 보관 (경로 수정)
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test