name: frontend-CD.yml

on:
  push:
    branches: [ "feat/Docker" ]
    paths:
      - 'frontend-kjb/**' # 💡 경로 수정
      - 'docker-compose.yml'

jobs:
  # 1) Docker 이미지 빌드 후 GHCR에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.string.outputs.image_lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: string
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cityfarm-frontend"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-kjb # 💡 경로 수정
          file: ./frontend-kjb/Dockerfile # 💡 경로 수정
          push: true
          tags: |
            ${{ steps.string.outputs.image_lower }}:latest
            ${{ steps.string.outputs.image_lower }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://54.86.192.52:8080

  # 2) EC2 서버에 SSH 접속해서 프론트엔드 서비스 재배포
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/cityfarm"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_NAME,ACTOR
          script: |
            # 1) 디렉토리 생성 및 이동
            mkdir -p ~/cityfarm
            cd ~/cityfarm
            
            # 2) GHCR 로그인
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # 3) 최신 프론트엔드 이미지 Pull 및 컨테이너 재기동
            docker pull "$IMAGE_NAME":latest
            docker compose up -d frontend
            
            # 4) 구버전 이미지 정돈함
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image_lower }}
          ACTOR: ${{ github.actor }}