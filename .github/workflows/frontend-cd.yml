name: frontend-CD.yml

on:
  push:
    branches: [ "feat/Docker" ] # 프론트엔드 배포 대상 브랜치
    paths:
      - 'frontend/**'  # 💡 frontend 폴더가 변경될 때만 CD 실행
      - 'docker-compose.yml' # 💡 docker-compose.yml 변경 시에도 CD 실행

jobs:
  # 1) Docker 이미지 빌드 후 GHCR(GitHub Container Registry)에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.string.outputs.image_lower }}
    steps:
      # 1-1) 소스코드 체크아웃
      - uses: actions/checkout@v4

      # 1-2) GHCR 저장소 이름을 소문자로 변환 (GHCR 필수 규격)
      - name: Lowercase Repository Name
        id: string
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cityfarm-frontend"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "IMAGE_LOWER=${IMAGE_LOWER}" >> $GITHUB_ENV

      # 1-3) GHCR 로그인
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1-4) 프론트엔드 Docker 이미지 빌드 및 GHCR 푸시
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:latest
            ${{ env.IMAGE_LOWER }}:${{ github.sha }}

  # 2) EC2 서버에 SSH 접속해서 프론트엔드 서비스만 최신 이미지로 재배포
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      # 2-1) 최신 docker-compose.yml을 가져오기 위한 체크아웃 👈 추가
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2-2) 루트에 위치한 docker-compose.yml을 EC2로 복사 👈 추가
      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/cityfarm"

      # 2-3) SSH 접속 후 배포 수행
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_NAME,ACTOR
          script: |
            # 1) GHCR 로그인
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # 2) 디렉토리 이동 및 생성
            mkdir -p ~/cityfarm
            cd ~/cityfarm
            
            # 3) 최신 프론트엔드 이미지 당겨오기
            docker pull "$IMAGE_NAME":latest
            
            # 4) docker-compose 내의 frontend 서비스만 다운타임 최소화하여 재기동
            docker compose up -d frontend
            
            # 5) 미사용 구버전 이미지 정돈
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image_lower }}
          ACTOR: ${{ github.actor }}