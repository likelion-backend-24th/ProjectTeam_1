name: frontend-ci.yml

on:
  push:
    branches: [ "feat/Docker" ]
    paths:
      - 'frontend/**'  # 💡 frontend 폴더가 변경될 때만 CI 실행
  pull_request:
    branches: [ "feat/Docker" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend  # 💡 frontend 디렉토리 안에서 명령어를 실행하도록 지정

    steps:
      # 1) 소스코드 체크아웃
      - uses: actions/checkout@v4

      # 2) Node.js 환경 세팅 (LTS 버전 추천)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json' # 패키지 캐시로 속도 향상

      # 3) 의존성 라이브러리 설치
      - name: Install dependencies
        run: npm ci

      # 4) 프론트엔드 코드 빌드 테스트
      - name: Build frontend
        run: npm run build

      # 5) 단위 테스트 실행 (테스트 스크립트가 등록된 경우)
      # - name: Run tests
      #   run: npm test -- --watchAll=false