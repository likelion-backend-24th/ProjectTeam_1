name: backend-CD.yml

on:
  push:
    branches: [ "feat/Docker" ]     # main에 머지되면 배포

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/moneylog

jobs:
  # 1) 이미지 빌드 후 GHCR에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # GHCR에 push하려면 필요
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend             # 👈 Dockerfile과 소스코드가 있는 경로
          file: ./backend/Dockerfile     # 👈 실제 Dockerfile 파일의 위치 명시
          push: true
          tags: |
            ${{ steps.string.outputs.image_lower }}:latest
            ${{ steps.string.outputs.image_lower }}:${{ github.sha }}

  # 2) EC2에 SSH 접속해서 재배포
  deploy:
    needs: build-image        # 이미지 push가 끝나야 배포
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/moneylog
            # GHCR 로그인 (프라이빗 이미지 pull용)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # 최신 이미지 받아 재기동
            docker compose pull app
            docker compose up -d
            # 안 쓰는 옛 이미지 정리 (디스크 절약)
            docker image prune -f