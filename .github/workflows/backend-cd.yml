name: backend-CD.yml

on:
  push:
    branches: [ "feat/Docker" ]
    paths:
      - 'backend/**'

jobs:
  # 1) 이미지 빌드 후 GHCR에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.string.outputs.image_lower }}
    steps:
      - uses: actions/checkout@v4

      # 1-1) GitHub 계정/레포명을 전부 소문자로 변환 (GHCR 필수 규격)
      - name: Lowercase Repository Name
        id: string
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cityfarm-backend"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "IMAGE_LOWER=${IMAGE_LOWER}" >> $GITHUB_ENV

      # 1-2) GHCR 로그인
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1-3) 이미지 빌드 및 GHCR 푸시
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:latest
            ${{ env.IMAGE_LOWER }}:${{ github.sha }}

  # 2) EC2에 SSH 접속해서 재배포
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_NAME,ACTOR
          script: |
            # GHCR 로그인 (EC2 내부)
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # 최신 이미지 가져오기
            docker pull "$IMAGE_NAME":latest
            
            # 기존 컨테이너 중지 및 삭제
            docker stop cityfarm-backend || true
            docker rm cityfarm-backend || true
            
            # 새 컨테이너 실행
            docker run -d \
              --name cityfarm-backend \
              -p 8080:8080 \
              --restart always \
              "$IMAGE_NAME":latest
            
            # 안 쓰는 옛 이미지 정리
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image_lower }}
          ACTOR: ${{ github.actor }}