name: backend-CD.yml

on:
  push:
    branches: [ "feat/Docker" ]
    paths:
      - 'backend/**'

jobs:
  # 1) 이미지 빌드 후 GHCR에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.string.outputs.image_lower }}
    steps:
      # 1) 소스코드 체크아웃
      - uses: actions/checkout@v4

      # 2) GitHub Secrets의 내용으로 application-secret.yml 파일 생성 👈 이 부분 추가!
      - name: Create application-secret.yml
        run: |
          echo "${{ secrets.APPLICATION_SECRET_YML }}" > ./backend/src/main/resources/application-secret.yml

      # 1-1) GitHub 계정/레포명을 전부 소문자로 변환 (GHCR 필수 규격)
      - name: Lowercase Repository Name
        id: string
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cityfarm-backend"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "IMAGE_LOWER=${IMAGE_LOWER}" >> $GITHUB_ENV

      # 1-2) GHCR 로그인
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1-3) 이미지 빌드 및 GHCR 푸시
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args:
            DB_PASSWORD=${{secrets.DB_PASSWORD}}
          tags: |
            ${{ env.IMAGE_LOWER }}:latest
            ${{ env.IMAGE_LOWER }}:${{ github.sha }}

  # 2) EC2에 SSH 접속해서 재배포
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      # 👈 [추가 1] GitHub 레포지토리 코드 가져오기
      - uses: actions/checkout@v4

      # 👈 [추가 2] docker-compose.yml 및 .env 전송
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml" # 깃허브 루티드 디렉토리의 compose 파일
          target: "/home/${{ secrets.EC2_USER }}/cityfarm"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_NAME,ACTOR
          script: |
            # 1) GHCR 로그인
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # 2) 서버의 작업 디렉토리 이동 (없으면 생성)
            mkdir -p ~/cityfarm
            cd ~/cityfarm
            
            # 3) 최신 이미지 가져오기
            docker pull "$IMAGE_NAME":latest
            
            # 4) Docker Compose로 최신 이미지 반영 재기동
            docker compose down || true
            docker compose up -d
            
            # 5) 사용하지 않는 구버전 이미지 정리
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image_lower }}
          ACTOR: ${{ github.actor }}