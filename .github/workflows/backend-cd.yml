name: CD - Deploy Backend to EC2

on:
  push:
    branches: [ "feat/Docker" ] # 👈 1. 테스트 중인 브랜치 추가
    paths:
      - 'backend/**'                    # 👈 2. 백엔드 폴더 변경 시에만 실행

env:
  # 이미지를 소문자로 저장하기 위해 github.repository 사용
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  # 1) 이미지 빌드 후 GHCR에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend             # 👈 3. Dockerfile 및 소스가 있는 백엔드 경로 지정
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # 2) EC2에 SSH 접속해서 재배포
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          #  4. docker-compose 대신 docker run으로 단일 컨테이너 재실행
          script: |
            # 1) GHCR 로그인
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 2) 최신 이미지 가져오기
            docker pull ${{ env.IMAGE }}:latest
            
            # 3) 기존에 돌아가던 컨테이너 중지 및 삭제 (오류 방지용 || true)
            docker stop cityfarm-backend || true
            docker rm cityfarm-backend || true
            
            # 4) 새 컨테이너 실행 (8080 포트 연결)
            docker run -d \
              --name cityfarm-backend \
              -p 8080:8080 \
              --restart always \
              ${{ env.IMAGE }}:latest
            
            # 5) 안 쓰는 옛 이미지 정리
            docker image prune -f