name: backend-CD.yml

on:
  push:
    branches: [ "feat/Docker" ]
    paths:
      - 'backend/**'

jobs:
  # 1) 이미지 빌드 후 GHCR에 push
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lower: ${{ steps.string.outputs.image_lower }}
    steps:
      # 1) 소스코드 체크아웃
      - uses: actions/checkout@v4

      # 2) GitHub Secrets의 내용으로 application-secret.yml 파일 생성 👈 이 부분 추가!
      - name: Create application-secret.yml
        run: |
          echo "${{ secrets.APPLICATION_SECRET_YML }}" > ./backend/src/main/resources/application-secret.yml

      # 1-1) GitHub 계정/레포명을 전부 소문자로 변환 (GHCR 필수 규격)
      - name: Lowercase Repository Name
        id: string
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/cityfarm-backend"
          IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_lower=${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "IMAGE_LOWER=${IMAGE_LOWER}" >> $GITHUB_ENV

      # 1-2) GHCR 로그인
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1-3) 이미지 빌드 및 GHCR 푸시
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_LOWER }}:latest
            ${{ env.IMAGE_LOWER }}:${{ github.sha }}

  # 2) EC2에 SSH 접속해서 재배포
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_TOKEN,IMAGE_NAME,ACTOR,DB_PASSWORD
          script: |
            # 1) GHCR 로그인
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            
            # 2) 디렉토리 이동 및 생성
            mkdir -p ~/cityfarm
            cd ~/cityfarm
            
            # 3) .env 파일 생성
            echo "DB_PASSWORD=$DB_PASSWORD" > .env
            
            # 4) docker-compose.yml 직접 자동 생성 (SCP 실패 위험 제거)
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              db:
                image: mysql:8.0
                container_name: cityfarm-DB
                restart: always
                environment:
                  MYSQL_DATABASE: cityfarm
                  MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
                ports:
                  - "3306:3306"
                volumes:
                  - mysql_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              app:
                image: ${IMAGE_NAME}:latest
                container_name: cityfarm-backend
                restart: always
                ports:
                  - "8080:8080"
                depends_on:
                  db:
                    condition: service_healthy
                environment:
                  SPRING_PROFILES_ACTIVE: prod
                  SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cityfarm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
                  SPRING_DATASOURCE_USERNAME: root
                  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

            volumes:
              mysql_data:
            EOF
            
            # 5) 최신 이미지 pull 및 컨테이너 실행
            docker pull "$IMAGE_NAME":latest
            docker compose down || true
            docker compose up -d
            
            # 6) 안 쓰는 이미지 정리
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image_lower }}
          ACTOR: ${{ github.actor }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}